<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RightModel - Intelligent Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 RightModel</h1>
            <p class="tagline">Smart model selection for optimal resource usage</p>
            <button id="settingsBtn" class="settings-btn">⚙️ API Settings</button>
        </header>

        <div class="chat-container">
            <div id="chatMessages" class="chat-messages"></div>

            <div class="model-info-bar" id="modelInfoBar" style="display: none;">
                <span class="model-badge" id="modelBadge"></span>
                <span class="complexity-badge" id="complexityBadge"></span>
                <span class="reasoning-text" id="reasoningText"></span>
            </div>

            <div class="input-container">
                <textarea
                    id="messageInput"
                    class="message-input"
                    placeholder="Type your message... (Press Enter to send, Shift+Enter for new line)"
                    rows="1"
                ></textarea>
                <button id="sendBtn" class="send-btn">Send</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>API Configuration</h2>
            <p class="modal-description">Configure your API keys for different LLM providers</p>

            <div class="api-key-section">
                <label for="openaiKey">OpenAI API Key</label>
                <input type="password" id="openaiKey" placeholder="sk-...">
                <small>Models: GPT-4, GPT-3.5-Turbo</small>
            </div>

            <div class="api-key-section">
                <label for="anthropicKey">Anthropic API Key</label>
                <input type="password" id="anthropicKey" placeholder="sk-ant-...">
                <small>Models: Claude Opus, Claude Sonnet, Claude Haiku</small>
            </div>

            <div class="api-key-section">
                <label for="groqKey">Groq API Key (Optional)</label>
                <input type="password" id="groqKey" placeholder="gsk_...">
                <small>Models: Llama, Mixtral (Fast inference)</small>
            </div>

            <div class="api-key-section">
                <label for="ollamaUrl">Ollama URL (Optional)</label>
                <input type="text" id="ollamaUrl" placeholder="http://localhost:11434" value="http://localhost:11434">
                <small>Local models for simple tasks</small>
            </div>

            <div class="modal-actions">
                <button id="clearKeysBtn" class="clear-btn">Clear All Keys</button>
                <button id="saveKeysBtn" class="save-btn">Save Configuration</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
